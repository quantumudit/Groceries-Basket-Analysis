[project]
name = "groceries-basket-analysis"
version = "0.1.0"
description = "Market basket analysis using Python and Power BI for grocery transaction data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Udit Chatterjee", email = "quantumudit@gmail.com"}
]
keywords = ["data-analysis", "market-basket-analysis", "python", "powerbi", "data-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.3",
    "numpy>=2.3.1",
    "pandas>=2.3.1",
    "python-box>=7.3.2",
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
    "seaborn>=0.13.2",
]

[project.urls]
Homepage = "https://github.com/quantumudit/Groceries-Basket-Analysis"
Repository = "https://github.com/quantumudit/Groceries-Basket-Analysis"
Issues = "https://github.com/quantumudit/Groceries-Basket-Analysis/issues"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pre-commit>=4.0.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.3",
]
